<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="867px" height="395px" viewBox="0 0 867 395"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="b1"><g transform="translate(0.5,0.5)"><rect x="8" y="8" width="840" height="330" fill="#ffffff" stroke="#333333" stroke-width="1.2" stroke-dasharray="7.2 4.8" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(51, 51, 51);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="14px" style="fill: rgb(0, 0, 0);"><text x="12" y="30">fpu_divsqrt</text></g></g></g><g data-cell-id="b2"><g><rect x="48" y="68" width="200" height="90" fill="#ffe6cc" stroke="#b46504" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(180, 101, 4);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(0, 0, 0);"><text x="148" y="98">Start</text><text x="148" y="111">unpack, special cases,</text><text x="148" y="124">exponent: ea - eb (div)</text><text x="148" y="137">or (ea - 127) / 2 (sqrt)</text></g></g></g><g data-cell-id="b3"><g><rect x="328" y="58" width="220" height="50" fill="#dae8fc" stroke="#3a5f8f" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(58, 95, 143);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="438" y="88">partial remainder rem</text></g></g></g><g data-cell-id="b4"><g><rect x="328" y="138" width="220" height="70" fill="#ffe6cc" stroke="#b46504" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 230, 204); stroke: rgb(180, 101, 4);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="11px" style