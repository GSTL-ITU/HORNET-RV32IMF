 flags</text></g></g></g><g data-cell-id="t15"><g><rect x="48" y="198" width="280" height="100" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="start" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="48" y="233">one bit per cycle:</text><text x="48" y="246">27 steps for divide (24 bits + guard,</text><text x="48" y="259">round and a normalisation bit),</text><text x="48" y="272">26 steps for square root</text></g></g></g></g></g></g></svg>