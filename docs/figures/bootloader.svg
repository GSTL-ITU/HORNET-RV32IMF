<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="877px" height="548px" viewBox="0 0 877 548"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="b1"><g><rect x="8" y="8" width="200" height="40" fill="#f8cecc" stroke="#a33b37" stroke-width="1.5" pointer-events="all" style="fill: rgb(248, 206, 204); stroke: rgb(163, 59, 55);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="108" y="33">host: hornet_load.py</text></g></g></g><g data-cell-id="b2"><g><rect x="508" y="8" width="200" height="40" fill="#dae8fc" stroke="#3a5f8f" stroke-width="1.5" pointer-events="all" style="fill: rgb(218, 232, 252); stroke: rgb(58, 95, 143);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="12px" style="fill: rgb(0, 0, 0);"><text x="608" y="33">board: bootloader</text></g></g></g><g data-cell-id="w3"><g><path d="M 108 48 L 108 528" fill="none" stroke="#888888" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="7.5 4.5" pointer-events="stroke" style="stroke: rgb(136, 136, 136);"/></g></g><g data-cell-id="w4"><g><path d="M 608 48 L 608 528" fill="none" stroke="#888888" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="7.5 4.5" pointer-events="stroke" style="stroke: rgb(136, 136, 136);"/></g></g><g data-cell-id="w5"><g><path d="M 108 88 L 598.82 88" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 606.32 88 L 598.82 91.75 L 598.82 84.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t6"><g><rect x="118" y="71" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="82.5">'H' 'B'  (repeated until answered)</text></g></g></g><g data-cell-id="w7"><g><path d="M 608 128 L 117.18 128" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 109.68 128 L 117.18 124.25 L 117.18 131.75 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t8"><g><rect x="118" y="111" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="122.5">'R'  ready</text></g></g></g><g data-cell-id="w9"><g><path d="M 108 178 L 598.82 178" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 606.32 178 L 598.82 181.75 L 598.82 174.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t10"><g><rect x="118" y="161" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="172.5">'W' addr len data[len] crc32</text></g></g></g><g data-cell-id="w11"><g><path d="M 608 218 L 117.18 218" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 109.68 218 L 117.18 214.25 L 117.18 221.75 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t12"><g><rect x="118" y="201" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="212.5">'K' ok  /  'C' CRC error  /  'A' address refused</text></g></g></g><g data-cell-id="t13"><g><rect x="118" y="241" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="252.5">... one 'W' per 1 KB block of every ELF segment ...</text></g></g></g><g data-cell-id="w14"><g><path d="M 108 308 L 598.82 308" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 606.32 308 L 598.82 311.75 L 598.82 304.25 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t15"><g><rect x="118" y="291" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="302.5">'G' entry</text></g></g></g><g data-cell-id="w16"><g><path d="M 608 348 L 117.18 348" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 109.68 348 L 117.18 344.25 L 117.18 351.75 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t17"><g><rect x="118" y="331" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="342.5">'K'</text></g></g></g><g data-cell-id="t18"><g><rect x="118" y="381" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-style="italic" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="392.5">bootloader: fence.i, jump to entry</text></g></g></g><g data-cell-id="w19"><g><path d="M 608 438 L 117.18 438" fill="none" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(51, 51, 51);"/><path d="M 109.68 438 L 117.18 434.25 L 117.18 441.75 Z" fill="#333333" stroke="#333333" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(51, 51, 51); stroke: rgb(51, 51, 51);"/></g></g><g data-cell-id="t20"><g><rect x="118" y="421" width="480" height="14" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="11px" style="fill: rgb(51, 51, 51);"><text x="358" y="432.5">program output (printf on the UART)</text></g></g></g><g data-cell-id="b21"><g><rect x="628" y="68" width="230" height="70" fill="#ffffff" stroke="#333333" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(51, 51, 51);"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="10px" style="fill: rgb(0, 0, 0);"><text x="743" y="95">after reset: wait 1 s for 'H' 'B';</text><text x="743" y="107">without them start the</text><text x="743" y="119">program at address 0</text></g></g></g></g></g></g></svg>