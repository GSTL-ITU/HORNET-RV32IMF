# riscv-formal configuration for HORNET (5-stage pipelined RV32I[M][F]).
#
# scripts/run_formal.sh copies this file to build/formal/cores/hornet/ and
# replaces %RTL% with the absolute path of rtl/ and %ISA% with the formal ISA
# of the configuration (rv32i or rv32im; riscv-formal has no F model, the F
# configurations are checked with the FPU stand-in). Depths are in cycles: an
# instruction needs about 7 cycles from reset to retirement; the depths leave
# room for a few instructions in flight before the checked one.
#
# RISCV_FORMAL_ALTOPS: the multiplier and divider compute riscv-formal's
# alternative results, the divider runs 3 steps (ADR-0005) and the FPU is a
# stand-in with the same handshake (ADR-0009).

[options]
isa %ISA%
nret 1
csr_spec 1.12

[depth]
insn            12
reg        5    15
pc_fwd     5    15
pc_bwd     5    15
unique     1  8 15
causal     5    15
ill             12
csrw            12
csr_ill         12
csrc_zero  1    12
csrc_any   1    12
csrc_inc   1    12
csrc_const 1    12
cover      1    15

[csrs]
mcountinhibit

# The counter checks do not fit a core that does not retire every cycle:
# csrc_inc forgets a write (which legally replaces the counter) in any cycle
# without a retirement, and csrc_upcnt (strictly increasing) does not hold with
# mcountinhibit. minstret is compared exactly with Spike in the random programs
# and rv32mi-instret_overflow; mcycle has the csrw checks.
[filter-checks]
- csrc_inc_.*

[illegal_csrs]
fff     m       rw
7b0     m       rw
3a0     m       rw
3b0     m       rw
c03     m       rw
105     m       rw
180     m       rw

[defines]
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_ALTOPS

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[script-sources]
read_verilog -DRISCV_FORMAL_ALTOPS -I%RTL%/core -I%RTL%/fpu %RTL%/core/hornet_core.v %RTL%/core/if_stage.v %RTL%/core/id_stage.v %RTL%/core/ex_stage.v %RTL%/core/mem_stage.v %RTL%/core/wb_stage.v %RTL%/core/hazard_unit.v %RTL%/core/csr_unit.v %RTL%/core/regfile.v %RTL%/core/control_unit.v %RTL%/core/imm_decoder.v %RTL%/core/ALU.v %RTL%/core/mul.v %RTL%/core/div.v %RTL%/fpu/fpu_top.v %RTL%/fpu/fpu_decoder.v %RTL%/fpu/fpu_sign_inj.v %RTL%/fpu/fpu_min_max.v %RTL%/fpu/fpu_compare.v %RTL%/fpu/fpu_classifier.v

[cover]
always @* if (!reset) cover (channel[0].cnt_insns >= 4);
